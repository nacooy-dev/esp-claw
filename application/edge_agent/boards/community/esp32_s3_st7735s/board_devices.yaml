version: 1.0.0
# Devices for ESP32-S3-DevKitC-1 + ST7735S Display + TGAM1
devices:

  # ST7735S SPI Display (128x160 portrait)
  # Pin mapping:
  #   SCLK  → GPIO5
  #   MOSI  → GPIO7
  #   CS    → GPIO4
  #   DC    → GPIO8
  #   RST   → GPIO6
  #   BL    → GPIO46 (via ledc_backlight)
  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    version: default
    config:
      mirror_x: false
      mirror_y: false
      swap_xy: true
      invert_color: false
      x_max: 128
      y_max: 160
      io_spi_config:
        cs_gpio_num: 4
        dc_gpio_num: 8
        spi_mode: 0
        pclk_hz: 16000000
      lcd_panel_config:
        reset_gpio_num: 6
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        vendor_config: NULL
    peripherals:
      - name: spi_display

  # Display backlight
  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    peripherals:
      - name: ledc_backlight
