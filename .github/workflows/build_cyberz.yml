name: build-cyberz

on:
  workflow_dispatch:
  push:
    branches:
      - cyberz

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [cyberz, esp32_s3_st7735s]
    steps:
      - name: Checkout esp-claw
        uses: actions/checkout@v4
        with:
          path: esp-claw

      - name: Checkout ESP-IDF v5.5.4
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v5.5.4
          path: esp-idf

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESP-IDF toolchain
        run: cd esp-idf && ./install.sh esp32s3

      - name: Install esp-bmgr-assist
        run: |
          . $GITHUB_WORKSPACE/esp-idf/export.sh
          pip install esp-bmgr-assist

      - name: Generate board codes
        working-directory: esp-claw/application/edge_agent
        run: |
          . $GITHUB_WORKSPACE/esp-idf/export.sh
          idf.py bmgr -c ./boards -b ${{ matrix.board }}

      - name: Build firmware
        working-directory: esp-claw/application/edge_agent
        run: |
          . $GITHUB_WORKSPACE/esp-idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            esp-claw/application/edge_agent/build/bootloader/bootloader.bin
            esp-claw/application/edge_agent/build/partition_table/bin/partition-table.bin
            esp-claw/application/edge_agent/build/edge_agent.bin
            esp-claw/application/edge_agent/build/ota_data_initial.bin
            esp-claw/application/edge_agent/build/*.bin
