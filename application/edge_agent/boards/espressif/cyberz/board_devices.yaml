version: 1.0.0
# Devices Configuration
# CyberZ 原生: ST7789 240x320 (SPI3) + WS2812 (RMT)
devices:

  # === WS2812 板载 LED (GPIO48) ===
  - name: led_strip
    chip: ws2812
    type: custom
    version: default
    init_skip: true
    dependencies:
      espressif/led_strip:
        version: "^3.0"
        public: true
    config:
      max_leds: 1                  # Number of LEDs in the strip
    peripherals:
      - name: rmt_tx               # RMT TX peripheral used by the LED strip

  # 0.91" SSD1306 OLED（通过 I2C1 + Lua require("ssd1306") 直驱，不注册为 display_lcd 设备）
  # I2C1 外设已在 board_peripherals.yaml 中定义（i2c_oled），Lua 可直接使用

  # === ST7789 240x320 SPI 屏 ===
  # SPI3: SCLK=GPIO4, MOSI=GPIO5 | CS=GPIO15, DC=GPIO7, RST=GPIO6, 背光=GPIO16
  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    version: default
    config:
      mirror_x: false
      mirror_y: true
      swap_xy: true
      invert_color: true
      x_max: 320
      y_max: 240
      # esp_lcd_panel_io_spi_config_t fields
      io_spi_config:
        cs_gpio_num: 15
        dc_gpio_num: 7
        spi_mode: 0
        pclk_hz: 40000000

      lcd_panel_config:
        reset_gpio_num: 6
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        vendor_config: NULL
    peripherals:
      - name: spi_display

  # Display backlight control (fix: 官方 breadboard 没有设备引用 ledc_backlight，
  # GPIO16 一直空闲，背光从未被固件点亮；lcd_brightness 设备负责初始化并设为 100%)
  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - name: ledc_backlight
