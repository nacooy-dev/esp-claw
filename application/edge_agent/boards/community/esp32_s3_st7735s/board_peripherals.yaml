version: 1.0.0
# Peripherals for ESP32-S3-DevKitC-1 + ST7735S Display + TGAM1
peripherals:

  # UART1 for TGAM1 (GPIO17=TX, GPIO18=RX)
  - name: uart1_tgam
    type: uart
    role: master
    config:
      port: 1
      tx_io_num: 17
      rx_io_num: 18
      baud_rate: 9600
      data_bits: 8
      parity: UART_PARITY_DISABLE
      stop_bits: 1
      flow_ctrl: UART_HW_FLOWCTRL_DISABLE
      rx_buffer_size: 1024
      tx_buffer_size: 1024

  # SPI2_HOST for ST7735S Display (SCLK=GPIO5, MOSI=GPIO7)
  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        mosi_io_num: 7
        miso_io_num: -1
        sclk_io_num: 5
        max_transfer_sz: 4096

  # LEDC for display backlight control (GPIO46)
  - name: ledc_backlight
    type: ledc
    version: default
    config:
      gpio_num: 46
      speed_mode: LEDC_LOW_SPEED_MODE
      channel: 0
      timer_sel: 0
      duty: 512
      duty_resolution: LEDC_TIMER_10_BIT
      output_invert: false
