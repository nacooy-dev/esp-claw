version: 1.0.0
# Peripherals for ESP32-S3-DevKitC-1 + ST7735S Display
peripherals:

  # SPI2_HOST for ST7735S Display (SCLK=GPIO5, MOSI=GPIO7)
  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        data0_io_num: 7                   # MOSI_IO_NUM
        sclk_io_num: 5                    # SPI Clock signal
        max_transfer_sz: 4096

  # LEDC for display backlight control (GPIO46)
  - name: ledc_backlight
    type: ledc
    version: default
    config:
      gpio_num: 46
      freq_hz: 5000
      duty: 0
      duty_resolution: LEDC_TIMER_10_BIT
      output_invert: true
