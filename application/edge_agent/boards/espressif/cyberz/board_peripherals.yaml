version: 1.0.0
# Peripherals Configuration
# CyberZ 原生 ST7789 240x320 (SPI3) + TGAM1 (UART1) + WS2812 (RMT) + OLED (I2C1)
peripherals:

  # === LCD SPI — ST7789 (SPI3: SCLK=GPIO4, MOSI=GPIO5) ===
  - name: spi_display
    type: spi
    role: master
    config:
      # spi_bus_config_t fields
      spi_bus_config:
        spi_port: SPI3_HOST               # 0: SPI1_HOST, 1: SPI2_HOST, 2: SPI3_HOST
        data0_io_num: 5                   # MOSI_IO_NUM
        sclk_io_num: 4                    # SPI Clock signal
        max_transfer_sz: 6400             # Maximum transfer size in bytes : width * 2 * 10

  # === LCD BACKLIGHT CONTROL (GPIO16, LEDC, 由 lcd_brightness 设备驱动) ===
  - name: ledc_backlight
    type: ledc
    role: none
    config:
      gpio_num: 16
      freq_hz: 5000
      duty: 0
      duty_resolution: LEDC_TIMER_10_BIT
      output_invert: false

  # === I2C1 — 用于 0.91" SSD1306 OLED (GPIO41/42)，Lua 直驱 ===
  - name: i2c_oled
    type: i2c
    role: master
    config:
      port: 1
      pins:
        sda: 41
        scl: 42

  # === WS2812 — 板载 LED (GPIO48；原生 GPIO38 撞 flash IO4，已修正) ===
  - name: rmt_tx
    type: rmt
    role: tx
    config:
      gpio_num: 48
      clk_src: RMT_CLK_SRC_DEFAULT
      resolution_hz: 10000000
      mem_block_symbols: 64
      trans_queue_depth: 4
      flags:
        with_dma: true

  # === UART1 — TGAM1 (GPIO10=TX, GPIO9=RX) @ 57600 ===
  # ESP32-S3-DevKitC-1 板载 UART1 TX/RX 焊盘
  - name: uart_tgam
    type: uart
    config:
      uart_num: UART_NUM_1
      tx_io_num: 10
      rx_io_num: 9
      uart_config:
        baud_rate: 57600
        data_bits: UART_DATA_8_BITS
        parity: UART_PARITY_DISABLE
        stop_bits: UART_STOP_BITS_1
