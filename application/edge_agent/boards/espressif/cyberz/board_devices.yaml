version: 1.0.0
# Devices for CyberZ v2 — 融合小智板配件
devices:

  # I2S 麦克风 INMP441（标准 audio_codec，board_manager 自动处理）
  - name: mic
    chip: inmp441
    type: audio_codec
    version: default
    peripherals:
      - name: i2s_audio_in

  # I2S 功放 MAX98357A（标准 audio_codec，board_manager 自动处理）
  - name: speaker
    chip: max98357a
    type: audio_codec
    version: default
    peripherals:
      - name: i2s_audio_out

  # 0.91" SSD1306 OLED（通过 I2C1 + Lua require("ssd1306") 直驱，不注册为 display_lcd 设备）
  # I2C1 外设已在 board_peripherals.yaml 中定义（i2c_oled），Lua 可直接使用

  # ST7735S 1.8" SPI 屏 (SPI2, GPIO11=SCLK, GPIO12=MOSI, GPIO13=CS, GPIO14=DC)
  - name: display_lcd
    chip: st7735s
    type: display_lcd
    sub_type: spi
    version: default
    config:
      mirror_x: false
      mirror_y: false
      swap_xy: false
      invert_color: false
      x_max: 128
      y_max: 160
      io_spi_config:
        cs_gpio_num: 13
        dc_gpio_num: 14
        spi_mode: 0
        pclk_hz: 16000000
      lcd_panel_config:
        reset_gpio_num: -1
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        vendor_config: NULL
    peripherals:
      - name: spi_display

  # WS2812 板载 LED (GPIO48)
  - name: led_strip
    chip: ws2812
    type: custom
    version: default
    init_skip: true
    dependencies:
      espressif/led_strip:
        version: "^3.0"
        public: true
    config:
      max_leds: 1
    peripherals:
      - name: rmt_tx
