version: 1.0.0
# Peripherals for CyberZ v2 — 融合小智板音频 + SPI LCD 迁移到 SPI2
peripherals:

  # === I2S 麦克风 INMP441 (I2S0, STD stereo) ===
  - name: i2s_audio_in
    type: i2s
    role: master
    format: std-in
    config:
      port: 0
      sample_rate_hz: 16000
      clk_src: I2S_CLK_SRC_DEFAULT
      mclk_multiple: 256
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_STEREO
      slot_mask: I2S_STD_SLOT_LEFT
      pins:
        bclk: 5
        ws: 4
        din: 6

  # === I2S 功放 MAX98357A (I2S1, STD stereo) ===
  - name: i2s_audio_out
    type: i2s
    role: master
    format: std-out
    config:
      port: 1
      sample_rate_hz: 16000
      clk_src: I2S_CLK_SRC_DEFAULT
      mclk_multiple: 256
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_STEREO
      slot_mask: I2S_STD_SLOT_BOTH
      pins:
        mclk: -1
        bclk: 15
        ws: 16
        dout: 7
        din: -1

  # === I2C1 — 用于 0.91" SSD1306 OLED (GPIO41/42)，Lua 直驱 ===
  - name: i2c_oled
    type: i2c
    role: master
    config:
      port: 1
      pins:
        sda: 41
        scl: 42

  # === SPI2 — ST7735S 屏 (GPIO11=SCLK, GPIO12=MOSI) ===
  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        mosi_io_num: 12
        miso_io_num: -1
        sclk_io_num: 11
        max_transfer_sz: 3200

  # === WS2812 — 板载 LED (GPIO48) ===
  - name: rmt_tx
    type: rmt
    role: tx
    config:
      gpio_num: 48
      clk_src: RMT_CLK_SRC_DEFAULT
      resolution_hz: 10000000
      mem_block_symbols: 64
      trans_queue_depth: 4
      flags:
        with_dma: true

  # === UART1 — TGAM1 (GPIO17=TX, GPIO18=RX) @ 9600 ===
  - name: uart_tgam
    type: uart
    config:
      uart_num: UART_NUM_1
      tx_io_num: 17
      rx_io_num: 18
      uart_config:
        baud_rate: 9600
        data_bits: UART_DATA_8_BITS
        parity: UART_PARITY_DISABLE
        stop_bits: UART_STOP_BITS_1
